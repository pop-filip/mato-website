<!DOCTYPE html>
<html lang="de-AT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline — matografie.at</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%230a0a0a'/%3E%3Ctext x='32' y='50' font-family='Georgia%2C %22Times New Roman%22%2C serif' font-size='46' font-weight='400' fill='%23c8a45a' text-anchor='middle' letter-spacing='-1'%3Em%3C/text%3E%3C/svg%3E">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0a;
    color: rgba(255,255,255,0.7);
    font-family: Georgia, serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }
  .brand {
    font-size: 2.5rem;
    font-weight: 400;
    color: #fff;
    margin-bottom: 3rem;
    letter-spacing: 0.02em;
  }
  .brand em { color: #c8a45a; font-style: normal; }
  .icon {
    font-size: 3rem;
    margin-bottom: 1.5rem;
    opacity: 0.4;
  }
  h1 {
    font-size: 1.3rem;
    font-weight: 400;
    color: #fff;
    margin-bottom: 0.75rem;
    letter-spacing: 0.05em;
  }
  p {
    font-size: 0.95rem;
    line-height: 1.7;
    max-width: 320px;
    margin-bottom: 2rem;
    color: rgba(255,255,255,0.45);
  }
  button {
    background: transparent;
    border: 1px solid rgba(200,164,90,0.4);
    color: #c8a45a;
    font-family: Georgia, serif;
    font-size: 0.85rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 0.75rem 2rem;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
  }
  button:hover {
    border-color: #c8a45a;
    color: #fff;
  }
</style>
</head>
<body>

<div class="brand">mato<em>.</em></div>

<div class="icon">◌</div>
<h1>Keine Internetverbindung</h1>
<p>Bitte überprüfen Sie Ihre Netzwerkverbindung und versuchen Sie es erneut.</p>
<button onclick="window.location.reload()">Nochmal versuchen</button>

</body>
</html>
