<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>matografie.at — Desktop Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050505;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 60px;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .preview-label {
      color: #444;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 28px;
      text-align: center;
    }
    .preview-label strong { color: #e2b96f; }

    /* Browser shell */
    .browser {
      width: 1280px;
      max-width: 100%;
      background: #1c1c1e;
      border-radius: 12px;
      box-shadow:
        0 0 0 1px #2a2a2a,
        0 0 0 3px #111,
        0 40px 100px rgba(0,0,0,0.8);
      overflow: hidden;
    }

    /* Title bar */
    .titlebar {
      background: #2a2a2c;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #111;
    }

    .traffic-lights {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    .traffic-lights span {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: block;
    }
    .tl-close  { background: #ff5f57; }
    .tl-min    { background: #febc2e; }
    .tl-max    { background: #28c840; }

    .url-bar {
      flex: 1;
      background: #1c1c1e;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 5px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 480px;
      margin: 0 auto;
    }
    .url-bar svg { flex-shrink: 0; color: #4caf50; }
    .url-bar span {
      font-size: 12px;
      color: #888;
      letter-spacing: 0.2px;
    }
    .url-bar span em {
      color: #ccc;
      font-style: normal;
    }

    /* Viewport */
    .browser-screen {
      width: 100%;
      height: 800px;
      background: #0a0a0a;
      overflow: hidden;
      position: relative;
    }
    .browser-screen iframe {
      width: 1280px;
      height: 800px;
      border: none;
      display: block;
      transform-origin: top left;
    }

    /* Meta */
    .preview-meta {
      margin-top: 20px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }
    .badge {
      background: #111;
      border: 1px solid #222;
      color: #555;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 4px;
    }
    .badge em { color: #e2b96f; font-style: normal; }

    .note {
      color: #2a2a2a;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 20px;
      text-align: center;
    }

    /* Responsive scale */
    @media (max-width: 1340px) {
      .browser-screen iframe {
        transform: scale(0.85);
        width: 1280px;
        height: 940px;
      }
      .browser-screen { height: 680px; }
    }
    @media (max-width: 900px) {
      .browser-screen iframe {
        transform: scale(0.6);
        width: 1280px;
        height: 1333px;
      }
      .browser-screen { height: 480px; }
    }
  </style>
</head>
<body>

  <p class="preview-label"><strong>matografie.at</strong> — Desktop Preview</p>

  <div class="browser">

    <div class="titlebar">
      <div class="traffic-lights">
        <span class="tl-close"></span>
        <span class="tl-min"></span>
        <span class="tl-max"></span>
      </div>
      <div class="url-bar">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <rect x="3" y="11" width="18" height="11" rx="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <span>matografie<em>.at</em></span>
      </div>
    </div>

    <div class="browser-screen">
      <iframe
        src="index.html"
        title="matografie.at desktop preview"
        scrolling="yes"
        loading="eager">
      </iframe>
    </div>

  </div>

  <div class="preview-meta">
    <span class="badge">1280 × 800 — <em>Desktop</em></span>
    <span class="badge">matografie<em>.at</em></span>
    <span class="badge">Current: <em>index.html</em></span>
  </div>

  <p class="note">Preview — iframe → index.html • Nikad ne mijenjati ovaj fajl</p>

</body>
</html>
